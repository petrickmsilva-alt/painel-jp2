name: JP2 Flask and MySQL
on:
  pull_request:
  push:

jobs:
  flask:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      FLASK_SECRET_KEY: ci-only-flask-secret-not-for-production
      FLASK_COOKIE_SECURE: 'false'
      JP2_TEST_MYSQL_ISOLATED: '1'
      JP2_REQUIRE_MYSQL: '1'
      JP2_TEST_MYSQL_HOST: '127.0.0.1'
      JP2_TEST_MYSQL_PORT: '3306'
      JP2_TEST_MYSQL_USER: root
      JP2_TEST_MYSQL_PASSWORD: isolated-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Flask dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py corporate.py identity_policy.py tests
      - name: Static validation
        run: |
          python -m pip install ruff==0.9.10
          ruff check --select E9,F63,F7,F82 app.py
          ruff check --select E4,E7,E9,F63,F7,F82 corporate.py identity_policy.py tests
      - name: Unit, security and disposable MySQL integration tests
        run: python -m unittest discover -s tests -v
