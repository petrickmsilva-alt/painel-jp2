name: JP2 Fase 2 gates
on:
  pull_request:
  push:

jobs:
  contract-and-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      FLASK_SECRET_KEY: ci-only-flask-secret-not-for-production
      FLASK_COOKIE_SECURE: 'false'
      JP2_TEST_MYSQL_ISOLATED: '1'
      JP2_REQUIRE_MYSQL: '1'
      JP2_TEST_MYSQL_HOST: '127.0.0.1'
      JP2_TEST_MYSQL_PORT: '3306'
      JP2_TEST_MYSQL_USER: root
      JP2_TEST_MYSQL_PASSWORD: isolated-ci-password
      # Fase 2 flags intentionally absent: the gate asserts they default to off.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Flask dependencies
        run: python -m pip install -r requirements.txt ruff==0.9.10
      - name: Compile Python sources
        run: python -m compileall -q app.py corporate.py corporate_enforcement.py identity_policy.py revocable_sessions.py tests scripts
      - name: Static validation
        run: |
          ruff check --select E9,F63,F7,F82 app.py
          ruff check --select E4,E7,E9,F63,F7,F82 corporate.py corporate_enforcement.py identity_policy.py revocable_sessions.py tests scripts
      - name: Contract gate (OIDC=NO, flags off, no ERP/Commerce access)
        run: python scripts/check_contract.py
      - name: Route inventory reproducibility gate
        run: |
          python scripts/audit_routes.py
          git diff --exit-code -- docs/JP2-LEGACY-ROUTE-MATRIX.md
      - name: Unit, security and disposable MySQL integration tests
        run: |
          set -o pipefail
          if python -m unittest discover -s tests -v 2>&1 | tee /tmp/jp2-fase2-tests.log; then
            echo "Fase 2 suite passed"
          else
            python - <<'PYLOG'
          import pathlib
          text = pathlib.Path('/tmp/jp2-fase2-tests.log').read_text()[-1800:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=JP2 Fase 2 tests failed::' + text)
          PYLOG
            exit 1
          fi
